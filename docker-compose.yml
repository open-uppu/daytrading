services:
  # 1. MT5 FastAPI Bridge Server (Exposes port 8000 to MetaTrader 5)
  bridge:
    build: .
    container_name: agentic_mt5_bridge
    restart: unless-stopped
    ports:
      # The MT5 EA runs on the *Windows host* (or another box), while the bridge
      # runs inside this container. From the EA's point of view the container is
      # a DIFFERENT machine, so binding only 127.0.0.1 on the host would make the
      # published port unreachable from the EA. We therefore publish on all
      # interfaces and rely on the host firewall to restrict access.
      # SECURITY: restrict access to port 8000 to your LAN/loopback via host
      # firewall rules (see docs/DOCKER.md). Do not expose to the public internet.
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MT5_HOST=0.0.0.0
      - MT5_PORT=8000
    volumes:
      - D:/workspace/open-uppu/trader/daytrad/journal:/app/journal
      - D:/workspace/open-uppu/trader/daytrad/artifacts:/app/artifacts
      - D:/workspace/open-uppu/trader/daytrad/data:/app/data
      - D:/workspace/open-uppu/trader/daytrad/mt5:/app/mt5
      - D:/workspace/open-uppu/trader/daytrad/frontend:/app/frontend
      - D:/workspace/open-uppu/trader/daytrad/config.py:/app/config.py
      - D:/workspace/open-uppu/trader/daytrad/main.py:/app/main.py
    command: ["python3", "main.py", "bridge"]
    healthcheck:
      # Confirms uvicorn actually bound and the app is answering, so `squad`
      # (depends_on: service_healthy) does not start trading against a bridge
      # process that exists but is not yet serving requests.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/mt5/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 2. Multi-Asset Specialist Squad Agent (Gold, BTC, ETH)
  squad:
    build: .
    container_name: agentic_squad_agent
    # Live order generation is opt-in and one-shot by default. Never restart a
    # failed strategy loop and accidentally turn a check into unattended trade.
    profiles: ["live"]
    # "no": the loop exits 0 on daily target / max-loss lock; auto-restart would
    # reset the daily baseline and resume trading, defeating both limits.
    restart: "no"
    depends_on:
      bridge:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MT5_HOST=bridge
      - MT5_PORT=8000
      - BROKER_MODE=mt5
    volumes:
      - D:/workspace/open-uppu/trader/daytrad/journal:/app/journal
      - D:/workspace/open-uppu/trader/daytrad/artifacts:/app/artifacts
      - D:/workspace/open-uppu/trader/daytrad/data:/app/data
      - D:/workspace/open-uppu/trader/daytrad/agents:/app/agents
      - D:/workspace/open-uppu/trader/daytrad/core:/app/core
      - D:/workspace/open-uppu/trader/daytrad/mt5:/app/mt5
      - D:/workspace/open-uppu/trader/daytrad/mt4:/app/mt4
      - D:/workspace/open-uppu/trader/daytrad/frontend:/app/frontend
      - D:/workspace/open-uppu/trader/daytrad/risk:/app/risk
      - D:/workspace/open-uppu/trader/daytrad/learning:/app/learning
      - D:/workspace/open-uppu/trader/daytrad/backtest:/app/backtest
      - D:/workspace/open-uppu/trader/daytrad/main.py:/app/main.py
      - D:/workspace/open-uppu/trader/daytrad/test_order.py:/app/test_order.py
      - D:/workspace/open-uppu/trader/daytrad/config.py:/app/config.py
    command: ["python3", "main.py", "run", "--agent=all9", "--mode=mt5", "--interval=15", "--wait-for-live-data", "--continuous", "--no-loss-cutoff"]

  # 3. Standalone Paper Trading (No MT5 needed, runs autonomous simulation)
  paper:
    build: .
    container_name: agentic_paper_squad
    profiles: ["paper"]
    # Simulated orders on LIVE prices read from the bridge (no order ever reaches
    # the real account).  Balance/positions persist to
    # journal/paper_live/paper_state.json, so rebuilds/restarts keep the account.
    # Delete that file to start a fresh paper account.
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      - MT5_HOST=bridge
      - MT5_PORT=8000
    volumes:
      - D:/workspace/open-uppu/trader/daytrad/journal:/app/journal
      - D:/workspace/open-uppu/trader/daytrad/artifacts:/app/artifacts
      - D:/workspace/open-uppu/trader/daytrad/data:/app/data
    command: ["python3", "main.py", "run", "--agent=all", "--mode=paper", "--paper-feed=bridge", "--interval=10", "--wait-for-live-data"]

  # 6. Dev shell — analysis/tests/backtests against the live bridge, no auto-trading.
  #    `docker exec -it agentic_dev bash` then run any command by hand, e.g.
  #    `python3 main.py run --agent=gold --mode=paper --max-iter=1`
  #    Nothing starts trading on its own: the container just idles.
  dev:
    build: .
    container_name: agentic_dev
    profiles: ["dev"]
    restart: "no"
    depends_on:
      bridge:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MT5_HOST=bridge
      - MT5_PORT=8000
      - BROKER_MODE=paper
    volumes:
      - D:/workspace/open-uppu/trader/daytrad/journal:/app/journal
      - D:/workspace/open-uppu/trader/daytrad/artifacts:/app/artifacts
      - D:/workspace/open-uppu/trader/daytrad/data:/app/data
      - D:/workspace/open-uppu/trader/daytrad/agents:/app/agents
      - D:/workspace/open-uppu/trader/daytrad/core:/app/core
      - D:/workspace/open-uppu/trader/daytrad/mt5:/app/mt5
      - D:/workspace/open-uppu/trader/daytrad/mt4:/app/mt4
      - D:/workspace/open-uppu/trader/daytrad/frontend:/app/frontend
      - D:/workspace/open-uppu/trader/daytrad/risk:/app/risk
      - D:/workspace/open-uppu/trader/daytrad/learning:/app/learning
      - D:/workspace/open-uppu/trader/daytrad/backtest:/app/backtest
      - D:/workspace/open-uppu/trader/daytrad/scripts:/app/scripts
      - D:/workspace/open-uppu/trader/daytrad/tests:/app/tests
      - D:/workspace/open-uppu/trader/daytrad/main.py:/app/main.py
      - D:/workspace/open-uppu/trader/daytrad/test_order.py:/app/test_order.py
      - D:/workspace/open-uppu/trader/daytrad/config.py:/app/config.py
    command: ["sleep", "infinity"]

  # 4. Multi-Account: Secondary Account Bridge (e.g. Demo Standard on port 8001)
  bridge_demo:
    build: .
    container_name: agentic_mt5_bridge_demo
    restart: unless-stopped
    profiles: ["multi", "demo"]
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - MT5_HOST=0.0.0.0
      - MT5_PORT=8000
    volumes:
      - D:/workspace/open-uppu/trader/daytrad/journal_demo:/app/journal
      - D:/workspace/open-uppu/trader/daytrad/artifacts_demo:/app/artifacts
      - D:/workspace/open-uppu/trader/daytrad/data:/app/data
      - D:/workspace/open-uppu/trader/daytrad/mt5:/app/mt5
      - D:/workspace/open-uppu/trader/daytrad/frontend:/app/frontend
      - D:/workspace/open-uppu/trader/daytrad/config.py:/app/config.py
      - D:/workspace/open-uppu/trader/daytrad/main.py:/app/main.py
    command: ["python3", "main.py", "bridge"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/mt5/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 5. Multi-Account: Secondary Squad Agent (for Demo Standard)
  squad_demo:
    build: .
    container_name: agentic_squad_agent_demo
    profiles: ["multi", "demo"]
    restart: "no"
    depends_on:
      bridge_demo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MT5_HOST=bridge_demo
      - MT5_PORT=8000
      - BROKER_MODE=mt5
    volumes:
      - D:/workspace/open-uppu/trader/daytrad/journal_demo:/app/journal
      - D:/workspace/open-uppu/trader/daytrad/artifacts_demo:/app/artifacts
      - D:/workspace/open-uppu/trader/daytrad/data:/app/data
      - D:/workspace/open-uppu/trader/daytrad/agents:/app/agents
      - D:/workspace/open-uppu/trader/daytrad/core:/app/core
      - D:/workspace/open-uppu/trader/daytrad/mt5:/app/mt5
      - D:/workspace/open-uppu/trader/daytrad/mt4:/app/mt4
      - D:/workspace/open-uppu/trader/daytrad/frontend:/app/frontend
      - D:/workspace/open-uppu/trader/daytrad/risk:/app/risk
      - D:/workspace/open-uppu/trader/daytrad/learning:/app/learning
      - D:/workspace/open-uppu/trader/daytrad/backtest:/app/backtest
      - D:/workspace/open-uppu/trader/daytrad/main.py:/app/main.py
      - D:/workspace/open-uppu/trader/daytrad/test_order.py:/app/test_order.py
      - D:/workspace/open-uppu/trader/daytrad/config.py:/app/config.py
    command: ["python3", "main.py", "run", "--agent=all9", "--mode=mt5", "--interval=15", "--wait-for-live-data", "--journal-dir=journal_demo/"]
