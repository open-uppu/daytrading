services:
  # 1. MT5 FastAPI Bridge Server (Exposes port 8000 to MetaTrader 5)
  bridge:
    build: .
    container_name: agentic_mt5_bridge
    restart: unless-stopped
    ports:
      # The EA and agent run on this machine; do not expose a trade-control
      # endpoint to the LAN or the public network.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - MT5_HOST=0.0.0.0
      - MT5_PORT=8000
    volumes:
      - ./journal:/app/journal
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./mt5:/app/mt5
      - ./config.py:/app/config.py
      - ./main.py:/app/main.py
    command: ["python3", "main.py", "bridge"]

  # 2. Multi-Asset Specialist Squad Agent (Gold, BTC, ETH)
  squad:
    build: .
    container_name: agentic_squad_agent
    # Live order generation is opt-in and one-shot by default. Never restart a
    # failed strategy loop and accidentally turn a check into unattended trade.
    profiles: ["live"]
    # "no": the loop exits 0 on daily target / max-loss lock; auto-restart would
    # reset the daily baseline and resume trading, defeating both limits.
    restart: "no"
    depends_on:
      - bridge
    env_file:
      - .env
    environment:
      - MT5_HOST=bridge
      - MT5_PORT=8000
      - BROKER_MODE=mt5
    volumes:
      - ./journal:/app/journal
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./agents:/app/agents
      - ./core:/app/core
      - ./mt5:/app/mt5
      - ./mt4:/app/mt4
      - ./risk:/app/risk
      - ./learning:/app/learning
      - ./backtest:/app/backtest
      - ./main.py:/app/main.py
      - ./test_order.py:/app/test_order.py
      - ./config.py:/app/config.py
    command: ["python3", "main.py", "run", "--agent=all", "--mode=mt5", "--interval=15", "--wait-for-live-data"]

  # 3. Standalone Paper Trading (No MT5 needed, runs autonomous simulation)
  paper:
    build: .
    container_name: agentic_paper_squad
    profiles: ["paper"]
    volumes:
      - ./journal:/app/journal
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    command: ["python3", "main.py", "run", "--agent=all", "--mode=paper", "--interval=10"]
